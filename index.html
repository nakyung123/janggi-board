<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!--
      탭 아이콘. 나무색 팔각 장기알에 초(楚) 한 글자.
      파일 대신 데이터 URI 로 박아 둔다. COEP require-corp 아래에서는 바깥에서
      받아오는 것이 막힐 수 있고, 이 도구는 인터넷 없이도 돌아야 한다.
    -->
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg%20xmlns='http://www.w3.org/2000/svg'%20viewBox='0%200%2032%2032'%3E%3Cpolygon%20points='22.6,3%2029,9.4%2029,22.6%2022.6,29%209.4,29%203,22.6%203,9.4%209.4,3'%20fill='%23f7f2e4'%20stroke='%23a9742f'%20stroke-width='2'/%3E%3Ctext%20x='16'%20y='23'%20font-size='19'%20font-family='serif'%20font-weight='700'%20text-anchor='middle'%20fill='%2315653c'%3E%E6%A5%9A%3C/text%3E%3C/svg%3E"
    />
    <!--
      검색에 걸리게 하는 자리(제목 · 설명 · 대표 주소 · 꼬리표).

      검색 로봇은 화면이 아니라 이 파일의 글자를 읽는다. 장기판은 프로그램이 돈 뒤에야
      그려지고 네이버 로봇과 AI 로봇은 대개 프로그램을 돌리지 않아서, 여기 적힌 것이
      그쪽이 아는 전부다.

      제목은 이름을 맨 앞에 두고 찾을 만한 말(무료 · 온라인 장기 · 대국 · 복기)을 뒤에
      붙였다. 탭이 좁으면 뒤가 잘려 이름만 남는다. 공유 미리보기의 제목(og:title)은
      이름만 둔다 - 거기는 그림과 설명이 같이 떠서 이름만으로 족하다.
    -->
    <title>장기 AI - 무료 온라인 장기 대국과 복기</title>
    <meta
      name="description"
      content="설치와 가입 없이 브라우저에서 바로 두는 무료 장기. 18급부터 9단까지 27단계 AI와 대국하고, 끝난 판은 AI가 수마다 등급과 승률 변화로 복기해 줍니다."
    />
    <!-- 같은 쪽이 주소 여러 개(?ref=… 따위)로 잡혀도 이 주소 하나로 셈하게 한다. -->
    <link rel="canonical" href="https://janggi-ai.vercel.app/" />
    <!--
      "무료로 쓰는 게임 웹 앱" 이라는 것을 로봇이 정해진 틀(schema.org)로 읽게 적는다.
      type 이 자바스크립트가 아니라서 실행되지 않는 자료 칸이고, CSP 의 script-src 에
      걸리지 않는다.
    -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "WebApplication",
        "name": "장기 AI",
        "url": "https://janggi-ai.vercel.app/",
        "description": "설치와 가입 없이 브라우저에서 바로 두는 무료 장기. 18급부터 9단까지 27단계 AI와 대국하고, 끝난 판은 AI가 수마다 등급과 승률 변화로 복기해 줍니다.",
        "applicationCategory": "GameApplication",
        "operatingSystem": "Any",
        "browserRequirements": "자바스크립트와 WebAssembly 를 지원하는 브라우저",
        "inLanguage": "ko",
        "isAccessibleForFree": true,
        "offers": { "@type": "Offer", "price": "0", "priceCurrency": "KRW" }
      }
    </script>

    <!--
      공유 미리보기(Open Graph).

      주소를 카톡·에브리타임·디스코드에 붙이면 저쪽 서버가 이 쪽을 긁어다 미리보기를
      만든다. 이 태그가 없으면 제목도 그림도 없이 주소 한 줄만 뜬다 - 사람을 모으려고
      뿌리는 링크인데 그러면 아무도 안 누른다.

      그림 주소를 절대경로로 적는 까닭 - 긁어가는 쪽은 우리 쪽이 아니라 남의 서버라서
      "/og.png" 같은 상대경로를 제 주소 기준으로 읽는다. 카톡이 특히 그렇다.
      그래서 주소가 바뀌면 여기도 같이 고쳐야 한다(지금은 janggi-ai.vercel.app).

      그림 자체는 scripts/og-card.html 을 찍어 둔 것이다. 고칠 일이 생기면 그 쪽을
      고쳐 다시 찍는다.
    -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="장기 AI" />
    <meta property="og:title" content="장기 AI" />
    <meta
      property="og:description"
      content="브라우저에서 바로 두는 장기. 급수를 골라 AI와 두고, 끝나면 한 수씩 되짚습니다."
    />
    <meta property="og:url" content="https://janggi-ai.vercel.app/" />
    <meta property="og:image" content="https://janggi-ai.vercel.app/og.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:locale" content="ko_KR" />
    <meta name="twitter:card" content="summary_large_image" />
  </head>
  <body>
    <div id="root"></div>
    <!--
      프로그램을 돌리지 못하는 쪽에만 보이는 소개.

      쓰는 사람에게는 로딩 중에도 보이지 않는다(프로그램이 켜져 있으면 브라우저가 이 칸을
      아예 그리지 않는다). 읽는 것은 프로그램을 돌리지 않는 검색 로봇과, 자바스크립트를
      꺼 둔 사람이다. #root 안에 넣으면 로봇은 같은 글을 읽지만 사람에게도 앱이 뜨기 전
      잠깐 비친다 - 그게 싫어서 여기 둔다. 대가: 구글은 이 칸의 글을 거의 쳐 주지 않는다.
      그쪽 몫은 소개 쪽(/about/)이 맡는다.
    -->
    <noscript>
      <div style="max-width: 640px; margin: 0 auto; padding: 24px">
        <h1>장기 AI</h1>
        <p>
          설치와 가입 없이 브라우저에서 바로 두는 무료 온라인 장기입니다. 18급부터 9단까지
          27단계 AI와 대국하고, 끝난 판은 AI가 한 수씩 복기해 줍니다.
        </p>
        <p>
          이 앱은 자바스크립트를 켜야 움직입니다.
          <a href="/about/">장기 AI 소개 보기</a>
        </p>
      </div>
    </noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
